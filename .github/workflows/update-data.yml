name: Update fund data

on:
  schedule:
    # 北京时间 06:00（UTC 前日 22:00，周日~周四）：早晨例行更新，确保开盘前是昨晚公布的最新净值
    - cron: "0 22 * * 0-4"
    # 北京时间 21:00（UTC 13:00）：晚间第一轮，多数基金当日净值已公布
    - cron: "0 13 * * 1-5"
    # 北京时间 23:00（UTC 15:00）：晚间兜底，捕捉晚公布和公布失败的基金
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fund data
        run: python3 fetch_data.py

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          git diff --cached --quiet || git commit -m "chore: update fund data $(date +%F %H:%M)"
          git push
