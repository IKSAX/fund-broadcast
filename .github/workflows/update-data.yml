name: Update fund data

on:
  schedule:
    # 每天北京时间 16:05（UTC 08:05）跑一次，收盘净值已更新
    - cron: "5 8 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fund data
        run: python3 fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update fund data $(date +%F)"
          git push
